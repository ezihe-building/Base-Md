name: Keep Render health check active

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Request Render health endpoint
        run: curl --fail --silent --show-error --max-time 30 --retry 2 --retry-delay 5 https://base-tele-x-wa.onrender.com/health
